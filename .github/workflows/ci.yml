name: CI

# pull requests only - pushes to main are GitLab's job, and on GitHub the only
# thing opening PRs here is Dependabot
on:
  pull_request:

# Dependabot-triggered runs get a read-only token and no access to
# "secrets.*" anyway, so state the floor explicitly
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: "zm"
          POSTGRES_PASSWORD: "zm"
          POSTGRES_DB: "zm_test"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zm -d zm_test"
          --health-interval 1s
          --health-timeout 2s
          --health-retries 30

    env:
      # postgres comes from the service above, so global-setup must not reach
      # for docker compose
      TEST_DB_AUTOSTART: "0"
      # overrides .env.test; idle_timeout lets the forked workers exit
      DATABASE_URL: "postgresql://zm:zm@localhost:5432/zm_test?idle_timeout=2"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v5

      # reads the pinned "packageManager" field from package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome ci --colors=off .

      - name: Dead code
        run: pnpm run knip

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests
        run: pnpm run test

      - name: Date tests in a non-UTC zone
        run: pnpm run test:tz

      - name: Migrations apply to an empty database and match the schema
        run: |
          psql "postgresql://zm:zm@localhost:5432/zm_test" -c "CREATE DATABASE zm_empty"
          DATABASE_URL="postgresql://zm:zm@localhost:5432/zm_empty" pnpm run db:migrate
          DATABASE_URL="postgresql://zm:zm@localhost:5432/zm_empty" pnpm exec drizzle-kit check
          # generating against the committed snapshot must find nothing new
          DATABASE_URL="x" pnpm exec drizzle-kit generate --name ci-drift-check
          git diff --exit-code --stat -- drizzle
          test -z "$(git status --porcelain -- drizzle)"

      - name: Build and smoke-test the standalone bundle
        env:
          SKIP_ENV_VALIDATION: "1"
        run: |
          pnpm run build:selfhosted
          cat > .env <<ENV
          DATABASE_URL=postgresql://zm:zm@localhost:5432/zm_test
          BETTER_AUTH_SECRET=ci-secret-ci-secret-ci-secret-ci-secret
          BETTER_AUTH_URL=http://127.0.0.1:3999
          CRON_SECRET=ci-cron-secret-0123456789
          ENV
          ./smoke-standalone.sh
