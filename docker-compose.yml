# Local / self-hosted stack with its own Postgres. Production on a VPS with the
# host's Postgres uses compose.vps.yml instead.
#
# All app services share one image. ".env.docker" is handed to the build as a
# secret (the Dockerfile reads its NEXT_PUBLIC_* and Sentry values while
# building) and to the containers as their runtime environment - it is never
# copied into the image.
name: zm

x-app: &app
  image: zm-v2-app
  env_file: .env.docker

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      # CHANGE THIS: the example password is public (it is in the repository).
      # Keep it in sync with DATABASE_URL in .env.docker.
      POSTGRES_USER: "zm"
      POSTGRES_PASSWORD: "change-me-this-password-is-public"
      POSTGRES_DB: "zm"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zm -d zm"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Runs to completion before the app starts, so the schema is never behind
  # the code; a failure here stops the deploy instead of surfacing later.
  migrator:
    <<: *app
    restart: "no"
    command: ["node", "migrate.mjs"]
    # builds the image the other services reuse
    build:
      context: .
      target: runner
      secrets:
        - dotenv
      # ties the build cache to the contents of .env.docker - see the
      # Dockerfile and README
      args:
        BUILD_ENV_REVISION: ${BUILD_ENV_REVISION:-}
    depends_on:
      postgres:
        condition: service_healthy

  next-app:
    <<: *app
    restart: unless-stopped
    ports:
      - "3333:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  # Calls the cron routes at 00:00 and 09:00 in APP_TIMEZONE
  cron:
    <<: *app
    restart: unless-stopped
    command: ["node", "cron.mjs"]
    environment:
      CRON_BASE_URL: http://next-app:3000
    healthcheck: { disable: true }
    depends_on:
      next-app:
        condition: service_healthy

volumes:
  postgres_data:

secrets:
  dotenv:
    file: .env.docker
