# Production on a VPS. CI builds the image (Dockerfile, target "runner") and
# copies this file to <PROD_OUT_PATH>/compose.yml, next to ".env" - see
# SELF-HOSTING.md "Self-hosted with Docker". Host Apache terminates TLS and
# proxies to 127.0.0.1:APP_PORT; Postgres stays on the host and is reached
# over its socket. Redis runs here, in memory only, for the rate-limit
# counters; the app falls back to Postgres whenever it is unreachable.
#
# The containers are locked down so a compromise of the app stays inside them:
# a UID that owns nothing on the host, a read-only filesystem, no capabilities,
# and nothing mounted but the Postgres socket. The app's database role can
# touch only this app's database. Redis has no published port and sits on an
# internal network that only "web" joins.
#
#   docker compose up -d
#   docker compose run --rm web node migrate.mjs   # what the deploy runs first
name: zm-v2

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    # The host journal keeps logs across deploys; json-file logs are deleted with the container (see pm2-logs README).
    driver: journald
    options: { labels: "com.docker.compose.project,com.docker.compose.service" }

x-app: &app
  <<: *hardened
  image: ${APP_IMAGE:?set APP_IMAGE in .env}:${IMAGE_TAG:-latest}
  init: true
  user: "10001:10001"
  pids_limit: 200

services:
  web:
    <<: *app
    env_file: .env
    ports:
      - "127.0.0.1:${APP_PORT:-8092}:3000"
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700,noexec,nosuid,size=64m
      # Next's own cache (fetch/images) - nothing here outlives a restart
      - /app/.next/cache:uid=10001,gid=10001,mode=0700,noexec,nosuid,size=128m
    volumes:
      # The host Postgres over its socket (DATABASE_SOCKET_PATH in .env): no
      # Postgres port has to be opened to containers.
      - /var/run/postgresql:/var/run/postgresql:ro
    environment:
      # built here so .env holds only the password (hex: nothing to escape)
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
    networks: [default, cache]
    mem_limit: 768m
    depends_on:
      # ordering only: with Redis down the app counts limits in Postgres
      redis:
        condition: service_healthy

  # Calls the cron routes at 00:00 and 09:00 in APP_TIMEZONE. It gets the two
  # values it needs and no env_file, so it never holds the database credentials.
  cron:
    <<: *app
    command: ["node", "cron.mjs"]
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Kyiv}
      CRON_BASE_URL: http://web:3000
    healthcheck: { disable: true }
    mem_limit: 128m
    depends_on:
      web:
        condition: service_healthy

  # Rate-limit counters only, so nothing is persisted: a restart just starts
  # every window afresh. "noeviction" makes a full Redis refuse writes (the app
  # then counts in Postgres) instead of silently dropping counters. Its own UID,
  # distinct from the app's, owning nothing on the host either.
  redis:
    <<: *hardened
    image: redis:8-alpine
    user: "10002:10002"
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 32mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    environment:
      # lets redis-cli (healthcheck, "docker compose exec") authenticate
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    tmpfs:
      - /data:uid=10002,gid=10002,mode=0700,noexec,nosuid,size=16m
    networks: [cache]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    pids_limit: 64
    mem_limit: 64m

networks:
  # no route outside: only the containers attached to it can reach redis
  cache:
    internal: true
