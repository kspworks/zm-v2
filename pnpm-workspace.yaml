engineStrict: true

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  '@sentry/cli': true
  esbuild: true
  sharp: true
  unrs-resolver: true

blockExoticSubdeps: true

minimumReleaseAge: 1440

overrides:
  # see the old repo: Turbopack's standalone tracer misses the "module-sync"
  # build of newer @swc/helpers, so the bundle can't load its own modules
  "@swc/helpers": "0.5.15"

minimumReleaseAgeExclude:
  - '@next/env@16.3.6'
  - '@next/eslint-plugin-next@16.3.6'
  - '@next/swc-darwin-arm64@16.3.6'
  - '@next/swc-darwin-x64@16.3.6'
  - '@next/swc-linux-arm64-gnu@16.3.6'
  - '@next/swc-linux-arm64-musl@16.3.6'
  - '@next/swc-linux-x64-gnu@16.3.6'
  - '@next/swc-linux-x64-musl@16.3.6'
  - '@next/swc-win32-arm64-msvc@16.3.6'
  - '@next/swc-win32-x64-msvc@16.3.6'
  - eslint-config-next@16.3.6
  - next@16.3.6
