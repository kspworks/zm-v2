engineStrict: true

allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  "@sentry/cli": true
  esbuild: true
  sharp: true
  unrs-resolver: true

blockExoticSubdeps: true

minimumReleaseAge: 1440

overrides:
  # Turbopack's standalone tracer misses the "module-sync" build of newer
  # @swc/helpers, so the bundle can't load its own modules
  "@swc/helpers": "0.5.15"
  "fast-uri@3.1.8": "3.1.9"
  "esbuild@0.18.20": "^0.25.0"
  # GHSA-3g3m-2fjr-6pw4 / GHSA-g3hv-75wg-m249: Sentry's bundler plugin,
  # react-email and ts-morph still ask for glob 13 / minimatch 10, which
  # have no patched release; they only call glob() / minimatch(), which
  # the new majors keep
  "glob@13": "^14.0.3"
  "minimatch@10": "^11.0.4"
  # deepmerge (GHSA-gcqx-w48m-w2h4) has no patched release; only the
  # shadcn CLI uses it, never the app at runtime
